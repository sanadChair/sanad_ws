# -------------------------------------------------------------------
# sanad_eye_tracking  –  tuneable parameters
# -------------------------------------------------------------------
sanad_eye_tracking:
  eye_tracker:
    ros__parameters:
      # Camera device index (0 = default webcam)
      camera_index: 0

      # How often the tracker publishes (Hz)
      publish_rate: 30.0

      # --- Gaze thresholds (normalised iris offset) ---
      # Horizontal: negative = left / positive = right
      gaze_horizontal_threshold: 0.015
      # Vertical:   negative = up   / positive = down
      gaze_vertical_threshold: 0.012

      # --- Blink / eye-closed detection ---
      # Eye-aspect-ratio below this value counts as "closed"
      ear_threshold: 0.20

      # Show a debug OpenCV window with landmarks drawn
      show_debug_window: true

  gaze_controller:
    ros__parameters:
      # Seconds the gaze must stay in one direction to trigger a move
      direction_hold_time: 3.0

      # Seconds both eyes must stay closed to trigger "go back"
      close_hold_time: 3.0

      # Maximum interval (s) between blinks to count as consecutive
      double_blink_max_interval: 0.6

      # Minimum interval (s) – ignore noise / single long blink
      double_blink_min_interval: 0.15

      # Number of consecutive blinks needed to trigger a "click"
      blink_count_for_click: 3

      # Cooldown (s) between any two commands to prevent spam
      command_cooldown: 1.0

      # Grid size (rows x cols) for the on-screen window layout
      grid_rows: 3
      grid_cols: 3
