# -------------------------------------------------------------------
# sanad_eye_tracking  –  tuneable parameters
# -------------------------------------------------------------------
sanad_eye_tracking:
  eye_tracker:
    ros__parameters:
      # Camera device index (0 = default webcam)
      camera_index: 0

      # How often the tracker publishes (Hz)
      publish_rate: 30.0

      # --- Gaze Mapping ---
      # Max absolute ratio for normalization to [0.0, 1.0]
      gaze_range_horizontal: 0.040
      gaze_range_vertical: 0.020
      
      # Offsets to center the cursor (adjust if cursor is stuck at top/bottom/left/right)
      gaze_offset_horizontal: 0.000
      gaze_offset_vertical: -0.015

      # Exponential Moving Average (EMA) smoothing factor (0.0 to 1.0)
      # Lower is smoother but laggier
      gaze_smoothing: 0.3

      # --- Blink / eye-closed detection ---
      # Eye-aspect-ratio below this value counts as "closed"
      ear_threshold: 0.20

      # Show a debug OpenCV window with landmarks drawn
      show_debug_window: true

  gaze_controller:
    ros__parameters:
      # Seconds both eyes must stay closed to trigger a "click"
      click_hold_time: 2.0

      # Cooldown (s) between any two commands to prevent spam
      command_cooldown: 1.0
